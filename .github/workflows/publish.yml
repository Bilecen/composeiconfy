name: Publish

# Publishes to the Gradle Plugin Portal when a version tag (e.g. v0.2.0) is pushed.
# Requires repo secrets GRADLE_PUBLISH_KEY and GRADLE_PUBLISH_SECRET.
# Bump `version` in iconfy-gradle-plugin/build.gradle.kts before tagging (the portal rejects
# re-publishing an existing version).
on:
  push:
    tags: [ 'v*' ]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish to Gradle Plugin Portal
        run: >-
          ./gradlew -p iconfy-gradle-plugin publishPlugins
          -Pgradle.publish.key=${{ secrets.GRADLE_PUBLISH_KEY }}
          -Pgradle.publish.secret=${{ secrets.GRADLE_PUBLISH_SECRET }}
